name: Release Validation

on:
  push:
    tags:
      - 'userscript-v*'

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify generated userscript is committed
        run: git diff --exit-code -- dist/chatgpt.user.js

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#userscript-v}"
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./.release-please-manifest.json')['.']")"
          userscript_version="$(sed -n 's#^// @version[[:space:]]*##p' dist/chatgpt.user.js | head -n 1)"
          userscript_namespace="$(sed -n 's#^// @namespace[[:space:]]*##p' dist/chatgpt.user.js | head -n 1)"

          test "$tag_version" = "$package_version"
          test "$tag_version" = "$manifest_version"
          test "$tag_version" = "$userscript_version"
          test "$userscript_namespace" = "danveitch76"
          grep -Fq "**Current downstream version:** \`$tag_version\`" README.md
          grep -Fq "## [$tag_version]" CHANGELOG.md

          echo "Validated userscript-v$tag_version against package, manifest, userscript, README and CHANGELOG."
